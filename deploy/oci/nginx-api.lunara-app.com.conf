# api.lunara-app.com -> Lunara API on 127.0.0.1:8010.
# Installed as /etc/nginx/sites-available/api.lunara-app.com (sorts after
# admin.lunara-app.com, so admin stays the port-80 default server).
server {
    listen 80;
    server_name api.lunara-app.com;

    location = /metrics { return 404; }
    location /ws/publish { return 404; }

    location /ws/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
