# api.lunara-app.com -> Lunara API on 127.0.0.1:8010.
# Installed as /etc/nginx/sites-available/api.lunara-app.com.
#
# Port 80: sorts after admin.lunara-app.com, so admin stays the implicit port-80 default;
# this block only answers Host: api.lunara-app.com (Cloudflare may still send http://).
# Port 443: Cloudflare Origin CA certificate (zone SSL mode Full). The api blocks carry an
# explicit server_name and are never default_server. The last block is the 443 catch-all,
# so an unknown SNI/Host on 443 gets no content and the connection is closed (444).
# nginx 1.18 on the box lacks ssl_reject_handshake, so the catch-all presents the same
# origin certificate during the handshake.

server {
    listen 80;
    server_name api.lunara-app.com;

    location = /metrics { return 404; }
    location /ws/publish { return 404; }

    location /ws/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}

server {
    listen 443 ssl;
    server_name api.lunara-app.com;

    ssl_certificate /etc/lunara/tls/api.lunara-app.com.pem;
    ssl_certificate_key /etc/lunara/tls/api.lunara-app.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /metrics { return 404; }
    location /ws/publish { return 404; }

    location /ws/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# 443 catch-all: keeps the api block above from becoming the implicit 443 default.
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/lunara/tls/api.lunara-app.com.pem;
    ssl_certificate_key /etc/lunara/tls/api.lunara-app.com.key;

    return 444;
}
