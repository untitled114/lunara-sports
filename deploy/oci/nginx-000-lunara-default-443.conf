# 443 catch-all, installed as /etc/nginx/sites-available/000-lunara-default-443.
# Its own file so it sorts first and is the only default_server on 443: an unknown SNI or
# Host on 443 gets no content and the connection is closed (444), and neither the api nor
# the admin 443 block (both with explicit server_name) can become the implicit default.
# nginx 1.18 on the box lacks ssl_reject_handshake, so the handshake presents the origin
# certificate (Cloudflare Origin CA; only Cloudflare's edge trusts it).
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/lunara/tls/api.lunara-app.com.pem;
    ssl_certificate_key /etc/lunara/tls/api.lunara-app.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}
