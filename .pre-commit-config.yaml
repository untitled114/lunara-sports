repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # e2e fixtures are byte-for-byte captures of real responses: never rewrite them.
      - id: trailing-whitespace
        exclude: ^frontend/e2e/fixtures/
      - id: end-of-file-fixer
        exclude: ^frontend/e2e/fixtures/
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']
        exclude: ^frontend/e2e/pages\.spec\.js-snapshots/
      # Full-page screenshot baselines (the home page's photos run ~600 KB at 1280px).
      - id: check-added-large-files
        name: check for added large files (e2e screenshot baselines)
        args: ['--maxkb=1000']
        files: ^frontend/e2e/pages\.spec\.js-snapshots/
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-api
        name: pytest api (coverage gate from pyproject)
        entry: bash -c 'cd api && python3 -m pytest tests/ -q --tb=short --no-header --cov --cov-report=term-missing'
        language: system
        pass_filenames: false
        files: ^api/
      - id: pytest-ingestion
        name: pytest ingestion (coverage gate from pyproject)
        entry: bash -c 'cd ingestion && python3 -m pytest tests/ -q --tb=short --no-header --cov --cov-report=term-missing'
        language: system
        pass_filenames: false
        files: ^ingestion/
      - id: pytest-lumen
        name: pytest lumen-bot (coverage gate from pyproject)
        entry: bash -c 'cd lumen-bot && python3 -m pytest tests/ -q --tb=short --no-header --cov --cov-report=term-missing'
        language: system
        pass_filenames: false
        files: ^lumen-bot/
      - id: design-check
        name: frontend design check
        entry: bash -c 'cd frontend && node scripts/check-design.mjs --strict && npx vitest run'
        language: system
        pass_filenames: false
        files: ^frontend/
