name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Lint & Test ─────────────────────────────────────────────────────────────
  python-lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lunara_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lunara_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ingestion/pyproject.toml
            api/pyproject.toml
            lumen-bot/pyproject.toml

      - name: Install ingestion dependencies
        run: cd ingestion && pip install ".[dev]"

      - name: Install api dependencies
        run: cd api && pip install ".[dev]"

      - name: Install lumen-bot dependencies
        run: cd lumen-bot && pip install -e ".[dev]"

      - name: Lint ingestion
        run: cd ingestion && ruff check src/ tests/

      - name: Lint api
        run: cd api && ruff check src/ tests/

      - name: Lint lumen-bot
        run: cd lumen-bot && ruff check *.py tests/

      - name: Test ingestion
        run: cd ingestion && pytest tests/ -q --cov --cov-report=term-missing

      - name: Test api
        run: cd api && pytest tests/ -q --cov --cov-report=term-missing

      - name: Test lumen-bot
        run: cd lumen-bot && pytest tests/ -q --cov --cov-report=term-missing

      - name: Integration tests (real Postgres)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lunara_it
        run: pytest tests/integration -q

      - name: Deploy script tests
        run: pytest deploy/tests -q
