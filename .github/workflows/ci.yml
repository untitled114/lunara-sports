name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Lint & Test ─────────────────────────────────────────────────────────────
  python-lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lunara_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lunara_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ingestion/pyproject.toml
            api/pyproject.toml
            lumen-bot/pyproject.toml
            ingestion/constraints.txt
            api/constraints.txt
            lumen-bot/constraints.txt

      # api/ and ingestion/ each declare a top-level package literally named `src`
      # (Task 15's packaging fix). Installing both into one interpreter makes the
      # second `pip install` lay its src/ files on top of the first's in
      # site-packages. Each service gets its own venv so that never happens.
      - name: Set up ingestion venv
        run: |
          python3 -m venv .venv-ingestion
          .venv-ingestion/bin/pip install -q --upgrade pip
          cd ingestion && ../.venv-ingestion/bin/pip install -q -c constraints.txt ".[dev]"

      - name: Set up api venv
        run: |
          python3 -m venv .venv-api
          .venv-api/bin/pip install -q --upgrade pip
          cd api && ../.venv-api/bin/pip install -q -c constraints.txt ".[dev]"

      - name: Set up lumen-bot venv
        run: |
          python3 -m venv .venv-lumen
          .venv-lumen/bin/pip install -q --upgrade pip
          cd lumen-bot && ../.venv-lumen/bin/pip install -q -c constraints.txt -e ".[dev]"

      - name: Lint ingestion
        run: cd ingestion && ../.venv-ingestion/bin/ruff check src/ tests/

      - name: Lint api
        run: cd api && ../.venv-api/bin/ruff check src/ tests/

      - name: Lint lumen-bot
        run: cd lumen-bot && ../.venv-lumen/bin/ruff check *.py tests/

      - name: Test ingestion
        run: cd ingestion && ../.venv-ingestion/bin/pytest tests/ -q --cov --cov-report=term-missing

      - name: Test api
        run: cd api && ../.venv-api/bin/pytest tests/ -q --cov --cov-report=term-missing

      - name: Test lumen-bot
        run: cd lumen-bot && ../.venv-lumen/bin/pytest tests/ -q --cov --cov-report=term-missing

      # tests/integration and deploy/tests need api's and ingestion's (plus
      # lumen-bot's, for pyyaml) runtime and dev dependencies, but never either
      # service's `src` package itself: tests/conftest.py loads api/src and
      # ingestion/src directly from their file paths under aliases
      # (api_src/ingestion_src) specifically so cross-service tests never need a
      # pip-installed, colliding top-level `src` (see test_aliases.py). Installing
      # only the dependency specifiers - never `pip install ./api` or
      # `pip install ./ingestion` - keeps `src` off this venv's site-packages.
      - name: Set up shared venv for integration + deploy tests (deps only, no local packages)
        run: |
          python3 -m venv .venv-shared
          .venv-shared/bin/pip install -q --upgrade pip
          .venv-shared/bin/python3 - <<'PYEOF'
          import subprocess
          import sys
          import tomllib

          deps: list[str] = []
          for path in ("ingestion/pyproject.toml", "api/pyproject.toml", "lumen-bot/pyproject.toml"):
              with open(path, "rb") as f:
                  project = tomllib.load(f)["project"]
              deps += project.get("dependencies", [])
              deps += project.get("optional-dependencies", {}).get("dev", [])

          # The same pins the services deploy with (deploy/tests checks they agree).
          constraints = [
              "-c", "ingestion/constraints.txt",
              "-c", "api/constraints.txt",
              "-c", "lumen-bot/constraints.txt",
          ]

          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", "-q", *constraints, *deps]
          )
          PYEOF

      - name: Integration tests (real Postgres)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lunara_it
        run: .venv-shared/bin/pytest tests/integration -q

      - name: Deploy script tests
        run: .venv-shared/bin/pytest deploy/tests -q

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Design check
        working-directory: frontend
        run: npm run design:check

      - name: Build
        working-directory: frontend
        run: npm run build
