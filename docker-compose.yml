version: "3.8"

services:
  # --- Infrastructure ---

  postgres:
    image: postgres:16
    container_name: pbp-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-playbyplay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-playbyplay}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER:-playbyplay}
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pbp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Application Services ---

  ingestion:
    build: ./ingestion
    container_name: pbp-ingestion
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-playbyplay}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-playbyplay}
      ESPN_POLL_INTERVAL_SECONDS: ${ESPN_POLL_INTERVAL_SECONDS:-5}
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build: ./api
    container_name: pbp-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-playbyplay}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-playbyplay}
      REDIS_URL: redis://redis:6379/0
    deploy:
      resources:
        limits:
          memory: 512M

  # --- Exporters ---

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: pbp-postgres-exporter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-playbyplay}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-playbyplay}?sslmode=disable"
    ports:
      - "9187:9187"
    deploy:
      resources:
        limits:
          memory: 128M

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: pbp-redis-exporter
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "9121:9121"
    deploy:
      resources:
        limits:
          memory: 128M

  # --- Monitoring ---

  prometheus:
    image: prom/prometheus
    container_name: pbp-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana
    container_name: pbp-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
