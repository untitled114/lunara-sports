[project]
name = "cephalon-lumen"
version = "0.1.0"
description = "Cephalon Lumen — Lunara Sports NBA pick alerts via Discord DM"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.4",
    "httpx>=0.27",
    "websockets>=13.0",
    "structlog>=24.4",
    "pyyaml>=6.0",
    "anthropic>=0.39",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "time-machine>=2.13",
    "ruff>=0.8,<0.17",  # capped: new ruff releases change rule defaults
]

[tool.setuptools]
py-modules = []  # Not a package — just a script collection with deps

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# strict-mode default requires @pytest.mark.asyncio on every async test, which
# is easy to forget and fails silently open (test collected but body skipped).
# auto mode runs every async def test as a coroutine test automatically.
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

# Explicit rule set (same as api/ and ingestion/) so a new ruff release can't
# silently change what CI enforces — 0.16 expanded the defaults and broke CI.
[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long — handled by ruff-format
    "SIM105", # contextlib.suppress — try/except/pass is fine
    "SIM108", # ternary — if/else is clearer with comments
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # tests put the bot dir on sys.path before importing

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", ".venv/*", "venv/*"]

[tool.coverage.report]
fail_under = 0      # raised to 99.1 in Task 16 once met
show_missing = true
skip_covered = true
